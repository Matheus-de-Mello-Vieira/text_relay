[project]
name = "text-relay"
version = "0.1.0"
description = "A simple text relay application."
authors = [{ name = "Matheus" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = []

[project.scripts]
text-relay = "text_relay.main:main"

[tool.poetry]
packages = [{ include = "text_relay" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
