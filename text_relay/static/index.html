<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TextRelay</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; } main { max-width: 760px; margin: auto; padding: 1.25rem; }
    form, .result { border: 1px solid #8887; border-radius: .65rem; padding: 1rem; margin-block: 1rem; }
    label, button { display: block; margin-block: .65rem; } input, button { font: inherit; }
    button { padding: .55rem .85rem; cursor: pointer; } button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 1.5rem; } .error { color: #b42318; } .success { color: #16803c; }
    .result-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; margin-bottom: 0; }
    @media (max-width: 480px) { main { padding: 1rem; } .result-header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>TextRelay</h1>
    <p>Take or select a photo, then extract its printed text.</p>
    <form id="upload-form">
      <label for="image">Image</label>
      <input id="image" name="file" type="file" accept="image/*" capture="environment" required>
      <button id="submit" type="submit">Extract text</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="submitted" hidden><h2>Latest submission</h2></section>
    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Recent results</h2>
      <div id="results"></div>
    </section>
  </main>
  <script>
    const form = document.querySelector("#upload-form");
    const imageInput = document.querySelector("#image");
    const submitButton = document.querySelector("#submit");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");
    const submitted = document.querySelector("#submitted");
    let lastResults = "";
    let newestResultId = null;

    function setStatus(message, state = "") {
      status.textContent = message;
      status.className = state;
    }
    function displayTime(value) { return new Date(value).toLocaleString(); }
    async function copyText(text, button) {
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "Copied";
        window.setTimeout(() => { button.textContent = "Copy"; }, 1200);
      } catch (_) {
        setStatus("Copy is unavailable here; select the text and copy it manually.", "error");
      }
    }
    function resultCard(result) {
      const card = document.createElement("article");
      card.className = "result";
      const header = document.createElement("div");
      header.className = "result-header";
      const timestamp = document.createElement("time");
      timestamp.dateTime = result.created_at;
      timestamp.textContent = displayTime(result.created_at);
      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "Copy";
      copy.addEventListener("click", () => copyText(result.text, copy));
      header.append(timestamp, copy);
      const text = document.createElement("pre");
      text.textContent = result.text;
      card.append(header, text);
      return card;
    }
    function renderResults(items) {
      const serialized = JSON.stringify(items);
      if (serialized === lastResults) return;
      lastResults = serialized;
      results.replaceChildren(...items.map(resultCard));
    }
    function wait(milliseconds) {
      return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
    }
    async function pollResults() {
      while (true) {
        try {
          const url = new URL("/api/results", window.location.origin);
          url.searchParams.set("wait", "true");
          if (newestResultId) url.searchParams.set("after", newestResultId);
          const response = await fetch(url);
          if (!response.ok) throw new Error();
          const items = (await response.json()).results;
          newestResultId = items[0]?.id || null;
          renderResults(items);
        } catch (_) {
          setStatus("Could not refresh recent results. Retrying soon.", "error");
          await wait(1000);
        }
      }
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!imageInput.files.length) return;
      submitButton.disabled = true;
      setStatus("Extracting text…");
      try {
        const response = await fetch("/api/ocr", { method: "POST", body: new FormData(form) });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Could not process the image.");
        const heading = document.createElement("h2");
        heading.textContent = "Latest submission";
        submitted.replaceChildren(heading, resultCard(body));
        submitted.hidden = false;
        setStatus("Text extracted successfully.", "success");
        newestResultId = body.id;
        renderResults([body, ...JSON.parse(lastResults || "[]").filter((item) => item.id !== body.id)]);
      } catch (error) {
        setStatus(error.message || "Could not process the image.", "error");
      } finally {
        submitButton.disabled = false;
      }
    });
    pollResults();
  </script>
</body>
</html>
